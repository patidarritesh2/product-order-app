# Optional: starts MongoDB + MySQL locally. Credentials match backend/.env.example
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: product_app
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
volumes:
  mongo_data:
  mysql_data:
